spring.application.name=scrambleid

# Database setup
spring.datasource.url=jdbc:mysql://localhost:3306/scrambleid?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fix charset/collation issues (you faced this earlier)
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.charSet=utf8mb4

# ===============================
# JWT CONFIG
# ===============================
# Use a strong 256-bit (or longer) secret in production
jwt.secret=MySuperSecretKeyForJwtThatIsAtLeast32BytesLong12345
jwt.expiration=3600000

# Optional: refresh token support (recommended)
jwt.refresh-expiration=86400000

# ===============================
# SPRING SECURITY LOGGING (DEBUG only for dev)
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# JACKSON CONFIG
# ===============================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

server.servlet.context-path=/api

scramble.client-id=b1105227-9fe8-4f90-89d7-fb0eb79c0621
scramble.client-secret=eaa0698028c8c94c34316be22e693b8ff059e1b1acaae7d3e2a1fe8da6a8a87d
scramble.base-url=https://prod.scrambleid.com

#application.client-id=01485052-e818-443d-bc3a-0c993f94d89d
#application.client-secret=ad83c22a916ff24bc70cb08b1bf614549c3c52a92b5ed3fc452c09ae74b8bb6c

# OIDC ID token verification (JWKS + iss/aud checks; tokens are RS256/PS256, not app jwt.secret)
scramble.oidc.jwks-uri=https://prod.scrambleid.com/oidc/inno/jwks
scramble.oidc.issuer=https://prod.scrambleid.com
