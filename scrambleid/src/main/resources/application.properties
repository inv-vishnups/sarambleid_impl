spring.application.name=scrambleid

# Database setup
spring.datasource.url=jdbc:mysql://localhost:3306/scrambleid?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fix charset/collation issues (you faced this earlier)
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.charSet=utf8mb4

# ===============================
# JWT CONFIG
# ===============================
# Use a strong 256-bit (or longer) secret in production
jwt.secret=MySuperSecretKeyForJwtThatIsAtLeast32BytesLong12345
jwt.expiration=3600000

# Optional: refresh token support (recommended)
jwt.refresh-expiration=86400000

# ===============================
# SPRING SECURITY LOGGING (DEBUG only for dev)
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# JACKSON CONFIG
# ===============================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

server.servlet.context-path=/api

