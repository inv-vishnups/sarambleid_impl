<div class="card">
  <div class="card-title success">
    <h3>Welcome back! You’ve successfully signed in.</h3>
  </div>
  <div class="card-body table-container">
    <table class="custom-table">
      <tbody>
        <tr>
          <td>Name</td>
          <td>{{ state?.name }}</td>
        </tr>
        <tr>
          <td>Email</td>
          <td>{{ state?.email }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="card-footer">
    <a routerLink="/login">Sign out!</a>
  </div>
</div>
